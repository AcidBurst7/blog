{% load blog_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container py-4"> 
    <header class=" pb-3 mb-4 border-bottom">
        <div class="d-flex">
            <a target="_blank" href="{% url 'blog:post_feed' %}" class="fs-2 text-decoration-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#000000" class="bi bi-rss-fill" viewBox="0 0 16 16">
                    <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm1.5 2.5c5.523 0 10 4.477 10 10a1 1 0 1 1-2 0 8 8 0 0 0-8-8 1 1 0 0 1 0-2m0 4a6 6 0 0 1 6 6 1 1 0 1 1-2 0 4 4 0 0 0-4-4 1 1 0 0 1 0-2m.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                </svg>
            </a>&nbsp;
            <a href="/" class="d-flex align-items-center text-body-emphasis text-decoration-none"> 
                <span class="fs-4">Мой блог</span> 
            </a>
        </div> 
        <div>
            <p>
                <i class="fs-7">Это мой блог. Статей в блоге - {% total_posts %}</i>
            </p>
        </div>
    </header> 
    <div class="row align-items-md-stretch"> 
        {% block content %}
        {% endblock %}
    </div> 
    <footer class="pt-3 mt-4 text-body-secondary border-top">© 2025 </footer> 
</div>

<script src="{% static 'js/bootstrap.min.js' %}"></script>

</body>
</html>
